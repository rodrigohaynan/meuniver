name: Aplicar suporte a mesversarios

on:
  push:
    paths:
      - '.github/workflows/apply-monthiversary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar alteracoes
        run: python3 .github/scripts/apply_monthiversary.py

      - name: Validar build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commitar alteracoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/types.ts components/new-invitation-form.tsx app/painel/page.tsx components/invitation-editor.tsx components/public-invitation.tsx supabase/schema.sql supabase/MIGRACAO_004_MESVERSARIOS.sql
          git commit -m "Adiciona suporte a convites de mêsversário"
          git push origin HEAD:main
